<!DOCTYPE html>
<html>
<head>
  <title>LogSift</title>
</head>
<body>

  <h1>Upload Log File</h1>

  <div id="uploadSection">
    <input type="file" id="file" />
    <button type="button" onclick="upload()">Analyze</button>
  </div>

  <div id="results" style="display:none;">
    <h2>Report</h2>
    <h3>Total Lines: <span class="totalLog"></span></h3>
    <h3>Parsed Lines: <span class="parsedlog"></span></h3>
    <h3>Malformed Lines: <span class="malformedlog"></span></h3>
    <h3>Top IPs</h3>
    <table border="1" id="ipsTable"></table>

    <h3>Most Hitted Endpoints</h3>
    <table border="1" id="hitsTable"></table>

    <h3>Most Error Endpoints</h3>
    <table border="1" id="errorsTable"></table>
  </div>

<script>

async function upload() {

  const fileInput = document.getElementById("file");

  const formData = new FormData();
  formData.append("logfile", fileInput.files[0]);

  const res = await fetch("/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  console.log(data);

  // hide upload section
  document.getElementById("uploadSection").style.display = "none";

  // show results section
  document.getElementById("results").style.display = "block";

  // =========================
  // TOP IPS TABLE
  // =========================
  let ipHTML = `
    <tr>
      <th>IP Address</th>
      <th>Requests</th>
    </tr>
  `;

  data.highestRequestedIp.forEach(([ip, count]) => {
    ipHTML += `
      <tr>
        <td>${ip}</td>
        <td>${count}</td>
      </tr>
    `;
  });

  document.getElementById("ipsTable").innerHTML = ipHTML;

  // =========================
  // MOST HITTED ENDPOINTS
  // =========================
  let hitsHTML = `
    <tr>
      <th>Endpoint</th>
      <th>Hits</th>
    </tr>
  `;

  data.mostHittedEndpoints.forEach(item => {
    hitsHTML += `
      <tr>
        <td>${item.path}</td>
        <td>${item.hits}</td>
      </tr>
    `;
  });

  document.getElementById("hitsTable").innerHTML = hitsHTML;

  // =========================
  // MOST ERROR ENDPOINTS
  // =========================
  let errorHTML = `
    <tr>
      <th>Endpoint</th>
      <th>Errors</th>
    </tr>
  `;

  data.mostErrorsEndpoints.forEach(item => {
    errorHTML += `
      <tr>
        <td>${item.path}</td>
        <td>${item.errors}</td>
      </tr>
    `;
  });

  document.getElementById("errorsTable").innerHTML = errorHTML;
  document.getElementsByClassName("totalLog")[0].textContent = data.totalLines;
  document.getElementsByClassName("parsedlog")[0].textContent = data.parsedLines;
  document.getElementsByClassName("malformedlog")[0].textContent = data.malformedLines;
}

</script>

</body>
</html>
